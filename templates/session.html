<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GazeGuard - Active Session</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/FavIcon.png') }}">
    <link href="http://fonts.googleapis.com/css?family=Hind:400,600,700" rel="stylesheet" type="text/css">
    
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" type="text/css"/>
</head>
<body class="session-body">

    <div id="calibration-modal">
        <div class="calibration-box">
            <h2>GazeGuard Calibration</h2>
            <p>Please look at the center of your screen to establish a baseline.</p>
            <div class="spinner"></div>
            <h1 id="countdown">3</h1>
        </div>
    </div>

    <div class="top-indicator">
        <span class="dot"></span> Session/Tracking Active
    </div>

    <div class="workspace">
        <div class="left-panel">
            <iframe id="pdf-viewer" src=""></iframe>
        </div>
        <div class="resizer" id="dragMe"></div>
        <div class="right-panel">
            <div class="camera-box">
                <img id="webcam-feed" src="" alt="Camera Feed">
            </div>
            <div class="controls-row" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 15px;">
                <button id="btn-landmarks" class="btn-sm-toggle" onclick="toggleVisual('show_landmarks')">Toggle Landmarks</button>
            </div>
        </div>
    </div>

    <div class="bottom-bar">
        <div class="session-timer">
            <span id="timer-display">00:00:00</span>
        </div>
        <button class="end-session-btn" onclick="endSession()">
            End Session <span class="icon-x">✖</span>
        </button>
    </div>

    <script>
        // --- GLOBAL TIMER VARIABLES ---
        let sessionTimerInterval;
        let sessionSeconds = 0;

        // --- LOAD MEDIA AND ADAPT LAYOUT ---
        window.onload = function() {
            const urlsJson = sessionStorage.getItem('gazeGuardPdfUrls');
            const docType = sessionStorage.getItem('gazeGuardDocType');
            const leftPanel = document.querySelector('.left-panel');

            if (urlsJson) {
                const urls = JSON.parse(urlsJson);
                if (urls.length > 0) {
                    leftPanel.innerHTML = ''; 
                    leftPanel.style.display = 'block'; 
                    leftPanel.style.overflowY = 'auto'; 
                    leftPanel.style.scrollBehavior = 'smooth';
                    leftPanel.style.backgroundColor = '#111';
                    
                    if (docType === 'landscape' && window.innerWidth > 768) {
                        leftPanel.style.flex = "2.5"; 
                    } else if (window.innerWidth > 768) {
                        leftPanel.style.flex = "1.5"; 
                    }

                    urls.forEach((url, index) => {
                        if (index > 0) {
                            const divider = document.createElement('div');
                            divider.className = 'doc-transition';
                            divider.innerHTML = `<span>⬇ Transitioning to File ${index + 1} ⬇</span>`;
                            leftPanel.appendChild(divider);
                        }

                        const ext = url.split('.').pop().toLowerCase();
                        let mediaElement;
                        
                        if (['mp4', 'webm'].includes(ext)) {
                            mediaElement = document.createElement('video');
                            mediaElement.controls = true;
                            mediaElement.src = url;
                            mediaElement.className = 'pdf-frame';
                        } else if (['png', 'jpg', 'jpeg'].includes(ext)) {
                            mediaElement = setupZoomableImage(url);
                        } else {
                            mediaElement = document.createElement('iframe');
                            mediaElement.src = url;
                            mediaElement.className = 'pdf-frame';
                        }

                        leftPanel.appendChild(mediaElement);
                    });
                }
            } else {
                leftPanel.innerHTML = "<h3 style='text-align:center; margin-top:50%; color:white;'>No Document Uploaded</h3>";
            }
            startCalibration();
        };

        // ---IMAGE ZOOM & PAN ---
        function setupZoomableImage(url) {
            const container = document.createElement('div');
            container.className = 'zoom-container';

            const img = document.createElement('img');
            img.src = url;
            img.className = 'zoom-target';
            img.ondragstart = (e) => e.preventDefault();

            const controls = document.createElement('div');
            controls.className = 'zoom-controls';
            controls.innerHTML = `<div class="zoom-btn zoom-out">-</div><div class="zoom-btn zoom-in">+</div>`;
            
            container.appendChild(img);
            container.appendChild(controls);

            let scale = 1;
            let panning = false;
            let pointX = 0, pointY = 0; 
            let startX = 0, startY = 0; 

            function setTransform() {
                scale = Math.min(Math.max(1, scale), 5);
                if (scale === 1) { pointX = 0; pointY = 0; }
                img.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
            }

            controls.querySelector('.zoom-in').onclick = (e) => { scale += 0.5; setTransform(); e.stopPropagation(); };
            controls.querySelector('.zoom-out').onclick = (e) => { scale -= 0.5; setTransform(); e.stopPropagation(); };
            container.onwheel = (e) => {
                e.preventDefault();
                scale += e.deltaY * -0.005; 
                setTransform();
            };
            img.onmousedown = (e) => {
                if (scale > 1) {
                    e.preventDefault();
                    startX = e.clientX - pointX;
                    startY = e.clientY - pointY;
                    panning = true;
                }
            };

            img.onmousemove = (e) => {
                if (!panning) return;
                e.preventDefault();
                pointX = e.clientX - startX;
                pointY = e.clientY - startY;
                setTransform();
            };

            img.onmouseup = () => { panning = false; };
            img.onmouseleave = () => { panning = false; };

            return container;
        }
        
        // --- CALIBRATION LOGIC ---
        function startCalibration() {
            document.getElementById('webcam-feed').src = "{{ url_for('video_feed') }}";
            let count = 3;
            const counterEl = document.getElementById('countdown');
            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    counterEl.innerText = count;
                } else {
                    clearInterval(interval);
                    counterEl.innerText = "Done!";
                    setTimeout(() => {
                        document.getElementById('calibration-modal').style.display = 'none';
                        startTimer(); 
                    }, 500);
                }
            }, 1000);
        }

        // --- GLOBAL TIMER FUNCTIONS ---
        function startTimer() {
            sessionTimerInterval = setInterval(() => {
                sessionSeconds++;
                const hrs = String(Math.floor(sessionSeconds / 3600)).padStart(2, '0');
                const mins = String(Math.floor((sessionSeconds % 3600) / 60)).padStart(2, '0');
                const secs = String(sessionSeconds % 60).padStart(2, '0');
                document.getElementById('timer-display').innerText = `${hrs}:${mins}:${secs}`;
            }, 1000);
        }

        function endSession() {
            document.getElementById('webcam-feed').src = ""; 
            fetch('/shutdown_camera').then(() => {
                window.location.href = "/"; 
            });
        }

        // --- DRAG TO RESIZE LOGIC ---
        const resizer = document.getElementById('dragMe');
        const leftPanel = document.querySelector('.left-panel');
        let isResizing = false;

        function setIframePointerEvents(value) {
            document.querySelectorAll('iframe, .zoom-container').forEach(el => el.style.pointerEvents = value);
        }

        function startResize(e) {
            isResizing = true;
            resizer.classList.add('resizing');
            setIframePointerEvents('none');
        }
        resizer.addEventListener('mousedown', startResize);
        resizer.addEventListener('touchstart', startResize, {passive: true});

        function moveResize(e) {
            if (!isResizing) return;
            
            let clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

            if (window.innerWidth <= 768) {
                document.body.style.cursor = 'ns-resize';
                let newHeight = clientY - 40; 
                const minHeight = window.innerHeight * 0.30;
                const maxHeight = window.innerHeight * 0.70;
                if (newHeight < minHeight) newHeight = minHeight;
                if (newHeight > maxHeight) newHeight = maxHeight;
                leftPanel.style.flex = `0 0 ${newHeight}px`;
            } else {
                document.body.style.cursor = 'ew-resize';
                let newWidth = clientX - 20; 
                const minWidth = window.innerWidth * 0.40;
                const maxWidth = window.innerWidth * 0.75;
                if (newWidth < minWidth) newWidth = minWidth;
                if (newWidth > maxWidth) newWidth = maxWidth;
                leftPanel.style.flex = `0 0 ${newWidth}px`;
            }
        }
        document.addEventListener('mousemove', moveResize);
        document.addEventListener('touchmove', moveResize, {passive: true});

        function stopResize(e) {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = 'default';
                resizer.classList.remove('resizing');
                setIframePointerEvents('auto');
            }
        }
        document.addEventListener('mouseup', stopResize);
        document.addEventListener('touchend', stopResize);

        function toggleVisual(feature) {
            fetch(`/toggle_visual/${feature}`)
            .then(response => response.json())
            .then(data => {
                const btn = document.getElementById('btn-landmarks');
                if (data.state) btn.style.opacity = '1'; else btn.style.opacity = '0.5';
            });
        }
    </script>
</body>
</html>
