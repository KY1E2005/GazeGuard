<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GazeGuard - Active Session</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/FavIcon.png') }}">
    <link href="http://fonts.googleapis.com/css?family=Hind:400,600,700" rel="stylesheet" type="text/css">
    
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" type="text/css"/>
</head>
<body class="session-body">

    <div id="calibration-modal">
        <div class="system-check-box">
            <h2 style="color:white; margin-bottom:10px;">Pre-Session Check</h2>
            <p>Please ensure all conditions are met to begin.</p>
            
            <div class="check-list">
                <div class="check-item" id="check-light">
                    <div class="label">
                        <span>☀</span> Lighting
                    </div>
                    <div class="status-icon">Checking...</div>
                </div>

                <div class="check-item" id="check-face">
                    <div class="label">
                        <span>☺</span> Face Detected
                    </div>
                    <div class="status-icon">Checking...</div>
                </div>

                <div class="check-item" id="check-center">
                    <div class="label">
                        <span>⌖</span> Centered
                    </div>
                    <div class="status-icon">Checking...</div>
                </div>
            </div>
            <div id="session-goal-container" style="margin-bottom: 15px; text-align: center; background: #111; padding: 12px; border-radius: 8px; border: 1px solid #333;">
                <label style="color: #ccc; font-size: 14px; font-weight: bold; margin-bottom: 5px; display: block;">Set Study Goal (Optional):</label>
                <div style="display: flex; gap: 20px; justify-content: center;">
                    <div>
                        <span style="color: #888; font-size: 11px; display: block; margin-bottom: 5px;">Minutes</span>
                        <div class="number-control">
                            <div class="number-left" onclick="stepTimer('session-goal-min', -1)">-</div>
                            <input type="number" id="session-goal-min" class="number-quantity" value="0" min="0">
                            <div class="number-right" onclick="stepTimer('session-goal-min', 1)">+</div>
                        </div>
                    </div>
                    <div>
                        <span style="color: #888; font-size: 11px; display: block; margin-bottom: 5px;">Seconds</span>
                        <div class="number-control">
                            <div class="number-left" onclick="stepTimer('session-goal-sec', -1, 59)">-</div>
                            <input type="number" id="session-goal-sec" class="number-quantity" value="0" min="0" max="59">
                            <div class="number-right" onclick="stepTimer('session-goal-sec', 1, 59)">+</div>
                        </div>
                    </div>
                </div>
            </div>
            <div style="margin-bottom: 20px; text-align: left; background: #111; padding: 12px; border-radius: 8px; border: 1px solid #333;">
                <label style="color: #ccc; display: flex; align-items: center; gap: 10px; cursor: pointer; margin: 0; font-size: 15px;">
                    <input type="checkbox" id="record-session-checkbox" checked style="width: 18px; height: 18px; cursor: pointer;">
                    Record this session (Video and Analytics)
                </label>
            </div>
            <button id="btn-start-session" class="btn-brand" disabled onclick="confirmStart()">Start Session</button>
        </div>
    </div>

    <div class="top-indicator">
        <span class="dot"></span> Session/Tracking Active
    </div>
    <canvas id="video-canvas" width="640" height="480" style="display:none;"></canvas>

    <div class="workspace">
        <div class="left-panel">
            <iframe id="pdf-viewer" src=""></iframe>
        </div>
        <div class="resizer" id="dragMe"></div>
        <div class="right-panel">
            <div class="camera-box">
                <img id="webcam-feed" src="" alt="Camera Feed">
            </div>
            <div class="controls-row" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 15px;">
                <button id="btn-landmarks" class="btn-sm-toggle" onclick="toggleVisual('show_landmarks')">Toggle Landmarks</button>
            </div>
        </div>
    </div>

    <div class="bottom-bar">
        <div class="session-timer">
            <span id="timer-display">00:00:00</span>
            <span id="goal-display" style="font-size: 14px; color: #888; margin-left: 5px; display: none;"></span>
        </div>
        <button class="end-session-btn" onclick="endSession()">
            End Session <span class="icon-x">✖</span>
        </button>
    </div>
    <div id="goal-toast-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 10000; justify-content: center; align-items: center;">
        <div style="background: #252525; border-top: 5px solid #00d26a; padding: 30px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90%; max-width: 400px; font-family: 'Hind', sans-serif; text-align: center;">
            <h4 style="color: white; margin: 0 0 15px 0; font-size: 20px; display: flex; align-items: center; justify-content: center; gap: 8px;">
                <span style="color: #00d26a;">✔</span> Goal Reached!
            </h4>
            <p style="color: #ccc; font-size: 15px; margin: 0 0 25px 0;">You have successfully completed your study target. The session is currently paused.</p>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button onclick="resumeSession()" style="background: #00d26a; color: #111; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s;">Continue Session</button>
                <button onclick="endSession()" style="background: #ff4d4d; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s;">End Session</button>
            </div>
        </div>
    </div>

    <script>
        // --- GLOBAL TIMER VARIABLES ---
        let sessionTimerInterval;
        let sessionSeconds = 0;

        function stepTimer(id, step, max = Infinity) {
            const input = document.getElementById(id);
            if (input.disabled) return;
            let val = parseInt(input.value) || 0;
            val += step;
            if (val < 0) val = 0;
            if (val > max) val = max;
            input.value = val;
        }

        //LOAD MEDIA AND ADAPT LAYOUT
        window.onload = function() {
            const urlsJson = sessionStorage.getItem('gazeGuardPdfUrls');
            const docType = sessionStorage.getItem('gazeGuardDocType');
            const leftPanel = document.querySelector('.left-panel');

            if (urlsJson) {
                const urls = JSON.parse(urlsJson);
                if (urls.length > 0) {
                    leftPanel.innerHTML = ''; 
                    leftPanel.style.display = 'block'; 
                    leftPanel.style.overflowY = 'auto'; 
                    leftPanel.style.scrollBehavior = 'smooth';
                    leftPanel.style.backgroundColor = '#111';
                    
                    if (docType === 'landscape' && window.innerWidth > 768) {
                        leftPanel.style.flex = "2.5"; 
                    } else if (window.innerWidth > 768) {
                        leftPanel.style.flex = "1.5"; 
                    }

                    urls.forEach((url, index) => {
                        if (index > 0) {
                            const divider = document.createElement('div');
                            divider.className = 'doc-transition';
                            divider.innerHTML = `<span>⬇ Transitioning to File ${index + 1} ⬇</span>`;
                            leftPanel.appendChild(divider);
                        }

                        const ext = url.split('.').pop().toLowerCase();
                        let mediaElement;
                        
                        if (['mp4', 'webm'].includes(ext)) {
                            mediaElement = document.createElement('video');
                            mediaElement.controls = true;
                            mediaElement.src = url;
                            mediaElement.className = 'pdf-frame';
                        } else if (['png', 'jpg', 'jpeg'].includes(ext)) {
                            mediaElement = setupZoomableImage(url);
                        } else {
                            mediaElement = document.createElement('iframe');
                            mediaElement.src = url;
                            mediaElement.className = 'pdf-frame';
                        }

                        leftPanel.appendChild(mediaElement);
                    });
                }
            } else {
                leftPanel.innerHTML = "<h3 style='text-align:center; margin-top:50%; color:white;'>No Document Uploaded</h3>";
            }

            //INJECT EXAM CANVAS
            const isExamMode = sessionStorage.getItem('isExamMode') === 'true';
        
        if (isExamMode) {
            const leftPanel = document.querySelector('.left-panel');
            leftPanel.style.flexDirection = 'column';
            
            leftPanel.innerHTML += `
                <div style="height: 50%; width: 100%; border-top: 2px solid #FD871F; background: #fff; display: flex; flex-direction: column; z-index: 10;">
                    <div style="background: #111; color: #FD871F; padding: 5px 15px; font-weight: bold; font-size: 14px; display: flex; justify-content: space-between;">
                        <span>Exam Answer Sheet</span>
                        <span style="color: #ff4d4d;">(Locked upon End Session)</span>
                    </div>
                    <textarea id="exam-answers-textarea" style="flex: 1; width: 100%; resize: none; padding: 15px; font-family: 'Hind', sans-serif; font-size: 15px; border: none; outline: none; box-sizing: border-box;" placeholder="Type your answers here..."></textarea>
                </div>
            `;
            const iframe = leftPanel.querySelector('iframe');
            if(iframe) iframe.style.height = '50%';
        }
            const storedGoal = sessionStorage.getItem('goalTimeMinutes');
            if (storedGoal) {
                document.getElementById('session-goal-timer').value = storedGoal;
            }
            if (isExamMode) {
                document.getElementById('session-goal-container').style.display = 'none';
                document.getElementById('session-goal-min').value = "0"; // Force 0
                document.getElementById('session-goal-sec').value = "0"; // Force 0
            }
            startCalibration();
        };

        // ---IMAGE ZOOM & PAN ---
        function setupZoomableImage(url) {
            const container = document.createElement('div');
            container.className = 'zoom-container';

            const img = document.createElement('img');
            img.src = url;
            img.className = 'zoom-target';
            img.ondragstart = (e) => e.preventDefault();

            const controls = document.createElement('div');
            controls.className = 'zoom-controls';
            controls.innerHTML = `<div class="zoom-btn zoom-out">-</div><div class="zoom-btn zoom-in">+</div>`;
            
            container.appendChild(img);
            container.appendChild(controls);

            let scale = 1;
            let panning = false;
            let pointX = 0, pointY = 0; 
            let startX = 0, startY = 0; 

            function setTransform() {
                scale = Math.min(Math.max(1, scale), 5);
                if (scale === 1) { pointX = 0; pointY = 0; }
                img.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
            }

            controls.querySelector('.zoom-in').onclick = (e) => { scale += 0.5; setTransform(); e.stopPropagation(); };
            controls.querySelector('.zoom-out').onclick = (e) => { scale -= 0.5; setTransform(); e.stopPropagation(); };
            container.onwheel = (e) => {
                e.preventDefault();
                scale += e.deltaY * -0.005; 
                setTransform();
            };
            img.onmousedown = (e) => {
                if (scale > 1) {
                    e.preventDefault();
                    startX = e.clientX - pointX;
                    startY = e.clientY - pointY;
                    panning = true;
                }
            };

            img.onmousemove = (e) => {
                if (!panning) return;
                e.preventDefault();
                pointX = e.clientX - startX;
                pointY = e.clientY - startY;
                setTransform();
            };

            img.onmouseup = () => { panning = false; };
            img.onmouseleave = () => { panning = false; };

            return container;
        }
        
        let checkInterval;
         // --- CALIBRATION LOGIC ---
        function startCalibration() {
            initSystemCheck();
        }

        function initSystemCheck() {
            document.getElementById('webcam-feed').src = "{{ url_for('video_feed') }}";
            const btn = document.getElementById('btn-start-session');
            checkInterval = setInterval(() => {
                fetch('/get_status')
                .then(res => res.json())
                .then(data => {
                    updateCheckItem('check-light', data.lighting_ok, data.lighting_ok ? "Good" : "Too Dark");
                    updateCheckItem('check-face', data.face_detected, data.face_detected ? "Detected" : "No Face");
                    updateCheckItem('check-center', data.centered, data.centered ? "Centered" : "Adjust Position");

                    if (data.lighting_ok && data.face_detected && data.centered) {
                        btn.disabled = false;
                        btn.classList.add('btn-start'); 
                        btn.innerText = "Start Session";
                    } else {
                        btn.disabled = true;
                        btn.classList.remove('btn-start');
                        btn.innerText = "Waiting for conditions...";
                    }
                });
            }, 500);
        }

        function updateCheckItem(id, isOk, statusText) {
            const item = document.getElementById(id);
            const icon = item.querySelector('.status-icon');
            
            if (isOk) {
                item.classList.add('success');
                icon.innerHTML = "✔ " + statusText;
            } else {
                item.classList.remove('success');
                icon.innerHTML = "✖ " + statusText;
            }
        }

        // --- DATA LOGGER VARIABLES ---
        let isRecordingEnabled = false;
        let sessionDataLog = [];
        let dataLoggerInterval;

        let mediaRecorder;
        let recordedChunks = [];
        let canvasDrawInterval;
        let sessionUploadedFiles = [];
        let isTabVisible = true;
        document.addEventListener("visibilitychange", () => {
            isTabVisible = !document.hidden;
        })

        function confirmStart() {
            clearInterval(checkInterval);
            const min = parseInt(document.getElementById('session-goal-min').value) || 0;
            const sec = parseInt(document.getElementById('session-goal-sec').value) || 0;
            const totalSeconds = (min * 60) + sec;
            sessionStorage.setItem('goalTimeSeconds', totalSeconds);
            isRecordingEnabled = document.getElementById('record-session-checkbox').checked;
            document.getElementById('calibration-modal').style.display = 'none';
            if (isRecordingEnabled) {
                startVideoRecorder();
            }
            startTimer();
        }

        //GLOBAL TIMER & SYNCHRONIZED LOGGER
        let goalReached = false;
        let goalChimeAudio = null;
        function startTimer() {
            const storedGoalSeconds = sessionStorage.getItem('goalTimeSeconds');
            const goalSeconds = storedGoalSeconds ? parseInt(storedGoalSeconds) : 0;

            if (goalSeconds > 0) {
                const displayMin = String(Math.floor(goalSeconds / 60)).padStart(2, '0');
                const displaySec = String(goalSeconds % 60).padStart(2, '0');
                document.getElementById('goal-display').innerText = `/ ${displayMin}:${displaySec}`;
                document.getElementById('goal-display').style.display = 'inline';
            }

            sessionTimerInterval = setInterval(() => {
                sessionSeconds++;
                const hrs = String(Math.floor(sessionSeconds / 3600)).padStart(2, '0');
                const mins = String(Math.floor((sessionSeconds % 3600) / 60)).padStart(2, '0');
                const secs = String(sessionSeconds % 60).padStart(2, '0');
                document.getElementById('timer-display').innerText = `${hrs}:${mins}:${secs}`;

                //the data is locked to the exact second on the timer
                if (isRecordingEnabled) {
                    const currentSec = sessionSeconds; 
                    fetch('/get_status')
                    .then(res => res.json())
                    .then(data => {
                        let finalScore = data.score || 0;
                        let finalStatus = data.status || "Unknown";
                        let finalBeep = data.beep_active || false;

                        if (!isTabVisible) {
                            finalScore = 0;
                            finalStatus = "Tab Switched/Hidden";
                            finalBeep = true;
                        }

                        sessionDataLog.push({
                            time: currentSec,
                            score: finalScore,
                            status: finalStatus,
                            beep_active: finalBeep,
                            phone_detected: data.phone_detected || false,
                            mar_action: data.mar_action || "None",
                            multiple_faces: data.multiple_faces || false
                        });
                    }).catch(e => console.error(e));
                }

                if (goalSeconds > 0 && sessionSeconds >= goalSeconds && !goalReached) {
                    goalReached = true;
                    
                    document.querySelector('.session-timer').style.color = '#00d26a';
                    
                    if (!goalChimeAudio) {
                        goalChimeAudio = new Audio("/assets/chime.wav");
                        goalChimeAudio.loop = true;
                        goalChimeAudio.volume = 0.5;
                    }
                    goalChimeAudio.play().catch(e => console.log("Audio blocked by browser."));
                    
                    document.getElementById('goal-toast-overlay').style.display = 'flex';
                    clearInterval(sessionTimerInterval);
                    if (isRecordingEnabled && mediaRecorder && mediaRecorder.state === "recording") {
                        mediaRecorder.pause();
                    }
                    //Pause uploaded study videos
                    document.querySelectorAll('video.pdf-frame').forEach(v => v.pause());
                }
            }, 1000);
        }

        function resumeSession() {
            document.getElementById('goal-toast-overlay').style.display = 'none';
            if (goalChimeAudio) {
                goalChimeAudio.pause();
                goalChimeAudio.currentTime = 0;
            }
            if (isRecordingEnabled && mediaRecorder && mediaRecorder.state === "paused") {
                mediaRecorder.resume();
            }
            //Resume uploaded study videos
            document.querySelectorAll('video.pdf-frame').forEach(v => v.play());
            startTimer();
        }

        function startVideoRecorder() {
            const img = document.getElementById('webcam-feed');
            const canvas = document.getElementById('video-canvas');
            const ctx = canvas.getContext('2d');

            canvasDrawInterval = setInterval(() => {
                if (img.complete && img.naturalWidth !== 0) {
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    if (!isTabVisible) {
                        // Darkens the frame
                        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.font = "bold 35px Arial";
                        ctx.fillStyle = "#ff4d4d";
                        ctx.textAlign = "center";
                        ctx.fillText("TAB SWITCHED/HIDDEN", canvas.width / 2, canvas.height / 2);
                    }
                }
            }, 1000 / 15);

            const stream = canvas.captureStream(15);
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) {
                    recordedChunks.push(e.data);
                }
            };

            mediaRecorder.onstop = async () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const sessionId = 'session_' + new Date().getTime();
                
                // Capture Thumbnail (grab current state of the canvas)
                const thumbnailDataUrl = canvas.toDataURL('image/jpeg', 0.7);

                // Fetch the files used from Session Storage
                let usedFiles = [];
                const urlsJson = sessionStorage.getItem('gazeGuardPdfUrls');
                if (urlsJson) {
                    const urls = JSON.parse(urlsJson);
                    usedFiles = urls.map(url => {
                        const parts = url.split('/');
                        const fileName = decodeURIComponent(parts[parts.length - 1]);
                        return { name: fileName, url: url };
                    });
                }

                const totalScore = sessionDataLog.reduce((sum, item) => sum + item.score, 0);
                const avgScore = sessionDataLog.length > 0 ? Math.round(totalScore / sessionDataLog.length) : 0;

                //GRAB EXAM TEXT IF IN EXAM MODE
                let examAnswerText = "";
                const isExamModeActive = sessionStorage.getItem('isExamMode') === 'true';
                if (isExamModeActive) {
                    const textArea = document.getElementById('exam-answers-textarea');
                    if (textArea) {
                        examAnswerText = textArea.value;
                    }
                }

                // Create final object with Thumbnail, Files, and Exam Data
                const sessionObject = {
                    id: sessionId,
                    timestamp: new Date().getTime(),
                    duration: sessionSeconds,
                    avgScore: avgScore,
                    videoBlob: blob,
                    thumbnail: thumbnailDataUrl, 
                    files: usedFiles, 
                    trackingData: sessionDataLog,
                    isExamMode: isExamModeActive,
                    examAnswerText: examAnswerText
                };

                await saveSessionToDB(sessionObject);
                window.location.href = "/dashboard"; 
            };

            mediaRecorder.start();
        }

        function saveSessionToDB(sessionObject) {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("GazeGuardDB", 2);
                
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains("user_sessions")) {
                        db.createObjectStore("user_sessions", { keyPath: "id" });
                    }
                };
                
                request.onsuccess = (e) => {
                    const db = e.target.result;
                    const tx = db.transaction("user_sessions", "readwrite");
                    const store = tx.objectStore("user_sessions");
                    store.put(sessionObject);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject();
                };
            });
        }

        function endSession() {
            // Stop chime if the user clicks End while it is ringing
            if (goalChimeAudio) {
                goalChimeAudio.pause();
            }
            document.getElementById('webcam-feed').src = ""; 
            if (isRecordingEnabled && sessionDataLog.length > 0) {
                clearInterval(sessionTimerInterval);
                clearInterval(canvasDrawInterval);
                mediaRecorder.stop();
                fetch('/shutdown_camera');
            } else {
                fetch('/shutdown_camera').then(() => {
                    window.location.href = "/"; 
                });
            }
        }

        // --- DRAG TO RESIZE LOGIC ---
        const resizer = document.getElementById('dragMe');
        const leftPanel = document.querySelector('.left-panel');
        let isResizing = false;

        function setIframePointerEvents(value) {
            document.querySelectorAll('iframe, .zoom-container').forEach(el => el.style.pointerEvents = value);
        }

        function startResize(e) {
            isResizing = true;
            resizer.classList.add('resizing');
            setIframePointerEvents('none');
        }
        resizer.addEventListener('mousedown', startResize);
        resizer.addEventListener('touchstart', startResize, {passive: true});

        function moveResize(e) {
            if (!isResizing) return;
            
            let clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

            if (window.innerWidth <= 768) {
                document.body.style.cursor = 'ns-resize';
                let newHeight = clientY - 40; 
                const minHeight = window.innerHeight * 0.30;
                const maxHeight = window.innerHeight * 0.70;
                if (newHeight < minHeight) newHeight = minHeight;
                if (newHeight > maxHeight) newHeight = maxHeight;
                leftPanel.style.flex = `0 0 ${newHeight}px`;
            } else {
                document.body.style.cursor = 'ew-resize';
                let newWidth = clientX - 20; 
                const minWidth = window.innerWidth * 0.40;
                const maxWidth = window.innerWidth * 0.75;
                if (newWidth < minWidth) newWidth = minWidth;
                if (newWidth > maxWidth) newWidth = maxWidth;
                leftPanel.style.flex = `0 0 ${newWidth}px`;
            }
        }
        document.addEventListener('mousemove', moveResize);
        document.addEventListener('touchmove', moveResize, {passive: true});

        function stopResize(e) {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = 'default';
                resizer.classList.remove('resizing');
                setIframePointerEvents('auto');
            }
        }
        document.addEventListener('mouseup', stopResize);
        document.addEventListener('touchend', stopResize);

        function toggleVisual(feature) {
            fetch(`/toggle_visual/${feature}`)
            .then(response => response.json())
            .then(data => {
                const btn = document.getElementById('btn-landmarks');
                if (data.state) btn.style.opacity = '1'; else btn.style.opacity = '0.5';
            });
        }
    </script>
</body>
</html>
